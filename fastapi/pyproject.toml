[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ranking-app"
version = "0.1.0"
description = "A ranking app backend that uses binary comparisons to eliminate rating bias"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]

dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.22.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=46.0.5",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.27",
    "psycopg[binary,pool]>=3.1.12",
    "asyncpg>=0.28.0",
    "email-validator>=2.3.0",
    "greenlet>=2.0.0",
    "google-auth[requests]>=2.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "aiosqlite>=0.19.0",
    "mypy>=1.3.0",
    "ruff>=0.15.0",
    "types-passlib>=1.7.7.20250602",
    "types-python-jose>=3.3.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
# PLR* are subjective refactor suggestions. Keep PLE (errors) + PLW (warnings)
# which catch real bugs.
ignore = [
    "PLR0911",  # too-many-return-statements
    "PLR0913",  # too-many-arguments (noisy with FastAPI Depends + CRUD)
    "PLR2004",  # magic-value-comparison (too noisy in tests, HTTP codes)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # asserts allowed in tests
    "S105",     # hardcoded test passwords
    "S106",     # hardcoded test passwords (kwarg)
    "PLC0415",  # scoped imports common in test fixtures
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# FastAPI / SQLAlchemy decorators are dynamically typed; strict's
# disallow_untyped_decorators is too noisy here.
disallow_untyped_decorators = false

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "tach>=0.34.1",
]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = [
    "app/__init__.py",
    "app/main.py",
    "app/settings.py",
    "app/db/database.py",
    "app/*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
