<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <script>
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('dark');
      }
    </script>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TierNerd" />
    <meta name="theme-color" content="#F7F7F8" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #F7F7F8;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background-color: #0B0B0E;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100vh;
        height: 100dvh;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background-color: #F7F7F8;
      }
      [id^="tiernerd-input-container-"] input,
      [id^="tiernerd-input-container-"] textarea {
        outline: none;
      }
      html[data-input-modality="keyboard"] [id^="tiernerd-input-container-"]:has(input:focus-visible),
      html[data-input-modality="keyboard"] [id^="tiernerd-input-container-"]:has(textarea:focus-visible) {
        outline: 2px solid var(--tiernerd-focus-color);
        outline-offset: 2px;
      }
      @media (forced-colors: active) {
        html[data-input-modality="keyboard"] [id^="tiernerd-input-container-"]:has(input:focus-visible),
        html[data-input-modality="keyboard"] [id^="tiernerd-input-container-"]:has(textarea:focus-visible) {
          outline-color: Highlight;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
