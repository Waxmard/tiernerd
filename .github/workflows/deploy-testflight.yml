name: Deploy TestFlight

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-testflight-main
  cancel-in-progress: false

jobs:
  deploy-ios-testflight:
    name: Upload iOS to TestFlight
    runs-on: macos-26
    environment: preview
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Upload to TestFlight
        run: make testflight
        env:
          EXPO_PUBLIC_API_URL: https://tiernerd-api-dev-1015723670625.us-east1.run.app
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '1015723670625-c2nlt7fbkh28odv6557bvfhgrfjnd1k2.apps.googleusercontent.com' }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 1015723670625-v0h15l5cj1eotf9h4u539q878e2mclm6.apps.googleusercontent.com
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
