name: E2E

on:
  push:
    branches: [main]
    paths: ["fastapi/**", "frontend/**", "scripts/**", ".github/workflows/e2e.yml"]
  pull_request:
    branches: [main]
    paths: ["fastapi/**", "frontend/**", "scripts/**", ".github/workflows/e2e.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # runs-on has no uv; scripts/e2e_backend.sh syncs and boots the backend with it.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "fastapi/uv.lock"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Smoke spec against a throwaway backend
        run: bash scripts/e2e_backend.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore
