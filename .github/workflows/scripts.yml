name: Scripts

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'Makefile', '.github/workflows/scripts.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'Makefile', '.github/workflows/scripts.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/ios-config.test.mjs
