name: Backend

on:
  push:
    branches: [main]
    paths: ["fastapi/**"]
  pull_request:
    branches: [main]
    paths: ["fastapi/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "fastapi/uv.lock"
      - run: uv sync --extra dev --group dev
      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=95

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "fastapi/uv.lock"
      - run: uv sync --extra dev
      - run: uv run ruff check app/
      - run: uv run ruff format --check app/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "fastapi/uv.lock"
      - run: uv sync --extra dev
      - run: uv run mypy app/

  boundaries:
    name: Module Boundaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "fastapi/uv.lock"
      - run: uv sync --extra dev --group dev
      - run: uv run tach check
